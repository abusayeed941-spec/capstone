# Ansible Inventory for E-Commerce Capstone
# Organize hosts by role

[webservers]
web1 ansible_host=10.0.2.20 ansible_user=devadmin ansible_ssh_private_key_file=~/.ssh/id_rsa
web2 ansible_host=10.0.2.30 ansible_user=devadmin ansible_ssh_private_key_file=~/.ssh/id_rsa

[dbservers]
db1 ansible_host=10.0.2.40 ansible_user=devadmin ansible_ssh_private_key_file=~/.ssh/id_rsa

[k8s_master]
k8s-master ansible_host=10.0.2.10 ansible_user=devadmin ansible_ssh_private_key_file=~/.ssh/id_rsa

[k8s_workers]
k8s-worker1 ansible_host=10.0.2.20 ansible_user=devadmin ansible_ssh_private_key_file=~/.ssh/id_rsa
k8s-worker2 ansible_host=10.0.2.30 ansible_user=devadmin ansible_ssh_private_key_file=~/.ssh/id_rsa

[bastion]
bastion ansible_host=10.0.1.50 ansible_user=devadmin ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_become=yes
ansible_become_method=sudo
ansible_become_user=root

# App configuration variables
[all:vars]
app_environment=production
app_port=5000
db_root_password=SecureRoot123!
db_name=ecommerce_db
db_user=ecommerce
db_password=ecommerce123
