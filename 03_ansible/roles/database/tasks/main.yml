# Database role — MySQL/MariaDB installation and configuration
- name: Install MySQL server
  package:
    name: mysql-server
    state: present
  ignore_errors: yes

- name: Install MariaDB (fallback on some RHEL systems)
  package:
    name: mariadb-server
    state: present
  ignore_errors: yes
  when: mysql_server_install is failed

- name: Ensure MySQL/MariaDB is running and enabled
  service:
    name: "{{ mysql_service_name }}"
    state: started
    enabled: yes

- name: Set MySQL root password and secure installation
  mysql_user:
    name: root
    host: localhost
    password: "{{ db_root_password }}"
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock

- name: Create application database
  mysql_db:
    name: "{{ db_name }}"
    state: present
    login_user: root
    login_password: "{{ db_root_password }}"

- name: Create application database user
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "%"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ db_root_password }}"

- name: Deploy database initialization script
  copy:
    dest: /tmp/init_ecommerce.sql
    content: |
      USE {{ db_name }};
      CREATE TABLE IF NOT EXISTS products (
          id VARCHAR(36) PRIMARY KEY,
          name VARCHAR(255) NOT NULL,
          price DECIMAL(10,2) NOT NULL,
          category VARCHAR(100),
          stock INT DEFAULT 0,
          image VARCHAR(255),
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS orders (
          id VARCHAR(36) PRIMARY KEY,
          session_id VARCHAR(100),
          total DECIMAL(10,2) NOT NULL,
          status VARCHAR(50) DEFAULT 'pending',
          shipping_address TEXT,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS order_items (
          id INT AUTO_INCREMENT PRIMARY KEY,
          order_id VARCHAR(36),
          product_id VARCHAR(36),
          name VARCHAR(255),
          price DECIMAL(10,2),
          qty INT,
          FOREIGN KEY (order_id) REFERENCES orders(id)
      );
    owner: root
    group: root
    mode: '0644'

- name: Initialize database schema
  command: mysql -u root -p{{ db_root_password }} < /tmp/init_ecommerce.sql
  args:
    creates: /var/lib/mysql/{{ db_name }}/products.ibd
  ignore_errors: yes

- name: Ensure MySQL binds to private IP (security)
  lineinfile:
    path: /etc/my.cnf
    regexp: '^bind-address'
    line: 'bind-address = {{ ansible_host }}'
  notify: restart mysql
  ignore_errors: yes

- name: Ensure MySQL is accessible from app subnet
  firewalld:
    port: 3306/tcp
    permanent: yes
    state: enabled
  ignore_errors: yes
