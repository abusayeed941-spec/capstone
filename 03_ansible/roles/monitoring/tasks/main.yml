# Monitoring role — Prometheus node exporter, alert basics
- name: Install Prometheus Node Exporter
  package:
    name: prometheus-node-exporter
    state: present
  ignore_errors: yes

- name: Install Node Exporter via tarball (fallback)
  unarchive:
    src: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: [--strip-components=1]
  ignore_errors: yes
  when: node_exporter_pkg is failed

- name: Ensure node exporter is running
  service:
    name: node_exporter
    state: started
    enabled: yes
  ignore_errors: yes

- name: Install Prometheus server (on monitoring host)
  unarchive:
    src: https://github.com/prometheus/prometheus/releases/download/v2.47.0/prometheus-2.47.0.linux-amd64.tar.gz
    dest: /opt/prometheus
    remote_src: yes
    extra_opts: [--strip-components=1]
  ignore_errors: yes

- name: Deploy Prometheus configuration
  copy:
    dest: /opt/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'node_exporter'
          static_configs:
            - targets: ['localhost:9100']

        - job_name: 'kubernetes'
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
              target_label: __address__
              regex: (.+)
              replacement: $1
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              target_label: __metrics_path__
              regex: (.+)
              replacement: $1

      rule_files:
        - /opt/prometheus/rules/*.yml

      alerting:
        alertmanagers:
          - static_configs:
              - targets: ['localhost:9093']
    mode: '0644'

- name: Create Prometheus rules directory
  file:
    path: /opt/prometheus/rules
    state: directory
    mode: '0755'

- name: Deploy alert rules
  copy:
    dest: /opt/prometheus/rules/alerts.yml
    content: |
      groups:
        - name: ecommerce-alerts
          rules:
            - alert: HighCPUUsage
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High CPU usage on {{ $labels.instance }}"
                description: "CPU usage is above 80% for more than 5 minutes."

            - alert: DiskSpaceLow
              expr: (1 - (node_filesystem_avail_bytes{mountpoint="/data"} / node_filesystem_size_bytes{mountpoint="/data"})) * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Disk space low on {{ $labels.instance }}"
                description: "Disk usage is above 85% on /data."

            - alert: PodDown
              expr: kubernetes_pod_status_phase{phase=~"Failed|Unknown"} == 1
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.pod }} is down"
                description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in Failed/Unknown state."
    mode: '0644'

- name: Deploy Prometheus systemd service
  copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus Monitoring System
      After=network.target

      [Service]
      Type=simple
      User=prometheus
      Group=prometheus
      ExecStart=/opt/prometheus/prometheus \
        --config.file=/opt/prometheus/prometheus.yml \
        --storage.tsdb.path=/opt/prometheus/data \
        --alertmanager.url=http://localhost:9093
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: reload systemd

- name: Create prometheus user
  user:
    name: prometheus
    system: yes
    create_home: no
  ignore_errors: yes

- name: Ensure Prometheus directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  loop:
    - /opt/prometheus/data
    - /opt/prometheus/rules

- name: Start Prometheus
  service:
    name: prometheus
    state: started
    enabled: yes
  ignore_errors: yes
