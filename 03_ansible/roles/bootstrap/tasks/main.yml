# Bootstrap role — base setup for all servers
- name: Update apt/yum cache
  package:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  package:
    name:
      - python3
      - python3-pip
      - git
      - curl
      - wget
      - vim
      - net-tools
      - jq
    state: present

- name: Install Python packages for Ansible
  pip:
    name:
      - boto3
      - docker
    state: present

- name: Ensure SSH directory exists
  file:
    path: /home/{{ ansible_user }}/.ssh
    state: directory
    mode: '0700'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Set SSH client config
  copy:
    dest: /home/{{ ansible_user }}/.ssh/config
    content: |
      Host *
          ServerAliveInterval 60
          ServerAliveCountMax 3
    mode: '0600'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Ensure log directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/log/ecommerce
    - /opt/ecommerce
