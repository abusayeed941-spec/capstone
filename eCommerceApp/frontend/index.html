<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopOnline — E-Commerce Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; color: #333; }
        .header { background: #1a73e8; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; }
        .header a { color: white; text-decoration: none; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .product-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; background: #eee; }
        .product-card h3 { margin-bottom: 5px; }
        .product-card .price { color: #1a73e8; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .product-card .stock { font-size: 13px; color: #666; margin-bottom: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:hover { background: #1557b0; }
        .btn-danger { background: #d93025; color: white; }
        .cart-section { background: white; border-radius: 8px; padding: 20px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .cart-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .cart-table th, .cart-table td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        .cart-summary { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .order-form { margin-top: 20px; }
        .order-form input, .order-form textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .alert { padding: 10px 15px; border-radius: 4px; margin-bottom: 10px; }
        .alert-success { background: #e6f4ea; color: #137333; border: 1px solid #b7e1c1; }
        .alert-error { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6c2; }
        .admin-panel { margin-top: 30px; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .admin-panel h2 { margin-bottom: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛒 ShopOnline</h1>
        <div>
            <a href="#products" style="margin-right: 15px;">Products</a>
            <a href="#cart" style="margin-right: 15px;">Cart</a>
            <a href="#admin">Admin</a>
        </div>
    </div>

    <div class="container">
        <!-- Products -->
        <div id="products">
            <h2 style="margin-bottom: 15px;">Products</h2>
            <input type="text" id="searchInput" placeholder="Search products..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
            <div class="product-grid" id="productGrid"></div>
        </div>

        <!-- Cart -->
        <div class="cart-section" id="cart" style="display: none;">
            <h2 style="margin-bottom: 15px;">Your Cart</h2>
            <div id="cartAlert"></div>
            <table class="cart-table">
                <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th><th>Action</th></tr></thead>
                <tbody id="cartBody"></tbody>
            </table>
            <div class="cart-summary">
                <h3>Total: $<span id="cartTotal">0.00</span></h3>
                <button class="btn btn-primary" onclick="checkout()">Checkout</button>
            </div>
            <div class="order-form" id="orderForm" style="display: none;">
                <h3>Shipping Address</h3>
                <textarea id="shippingAddress" rows="3" placeholder="Enter your shipping address..."></textarea>
                <button class="btn btn-primary" onclick="placeOrder()">Place Order</button>
            </div>
            <div id="orderAlert"></div>
        </div>

        <!-- Order Confirmation -->
        <div id="orderHistory" style="margin-top: 20px;"></div>

        <!-- Admin Panel -->
        <div class="admin-panel" id="admin">
            <h2>Admin — Add Product</h2>
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="adminName" placeholder="e.g. Wireless Keyboard">
            </div>
            <div class="form-group">
                <label>Price ($)</label>
                <input type="number" id="adminPrice" step="0.01" placeholder="29.99">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="adminCategory">
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Appliances">Appliances</option>
                    <option value="Office">Office</option>
                    <option value="General">General</option>
                </select>
            </div>
            <div class="form-group">
                <label>Stock</label>
                <input type="number" id="adminStock" placeholder="100">
            </div>
            <div class="form-group">
                <label>Image Filename</label>
                <input type="text" id="adminImage" placeholder="keyboard.jpg">
            </div>
            <button class="btn btn-primary" onclick="addProduct()">Add Product</button>
            <div id="adminAlert"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.API_BASE || "http://localhost:5000";
        const SESSION_ID = "web-" + Math.random().toString(36).substr(2, 9);
        let cart = [];
        let orders = [];

        async function fetchProducts() {
            const resp = await fetch(`${API_BASE}/api/products`);
            const data = await resp.json();
            renderProducts(data.products);
        }

        function renderProducts(products) {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${API_BASE}/static/images/${p.image}" alt="${p.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22><rect fill=%22%23eee%22 width=%22150%22 height=%22150%22/><text x=%2275%22 y=%2280%22 text-anchor=%22middle%22 font-size=%2214%22 fill=%22%23999%22>${p.name}</text></svg>'">
                    <h3>${p.name}</h3>
                    <div class="price">$${p.price.toFixed(2)}</div>
                    <div class="stock">Stock: ${p.stock} units</div>
                    <button class="btn btn-primary" onclick="addToCart('${p.id}')">Add to Cart</button>
                </div>
            `).join("");
        }

        async function addToCart(productId) {
            const resp = await fetch(`${API_BASE}/api/cart`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: SESSION_ID, product_id: productId, qty: 1 })
            });
            const data = await resp.json();
            if (data.error) { showAlert("cartAlert", data.error, "error"); return; }
            cart = data.cart;
            showCart();
            showAlert("cartAlert", "Added to cart!", "success");
        }

        function showCart() {
            document.getElementById("cart").style.display = "block";
            const tbody = document.getElementById("cartBody");
            const total = cart.reduce((s, item) => s + item.price * item.qty, 0);
            tbody.innerHTML = cart.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td>$${item.price.toFixed(2)}</td>
                    <td>${item.qty}</td>
                    <td>$${(item.price * item.qty).toFixed(2)}</td>
                    <td><button class="btn btn-danger" onclick="removeFromCart('${item.id}')">Remove</button></td>
                </tr>
            `).join("");
            document.getElementById("cartTotal").textContent = total.toFixed(2);
        }

        async function removeFromCart(productId) {
            const resp = await fetch(`${API_BASE}/api/cart/${productId}?session_id=${SESSION_ID}`, { method: "DELETE" });
            const data = await resp.json();
            cart = data.cart;
            showCart();
        }

        async function checkout() {
            document.getElementById("orderForm").style.display = "block";
        }

        async function placeOrder() {
            const address = document.getElementById("shippingAddress").value;
            const resp = await fetch(`${API_BASE}/api/orders`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: SESSION_ID, shipping_address: address })
            });
            const order = await resp.json();
            if (order.error) { showAlert("orderAlert", order.error, "error"); return; }
            orders.push(order);
            document.getElementById("orderForm").style.display = "none";
            document.getElementById("shippingAddress").value = "";
            showAlert("orderAlert", `Order ${order.order_id} placed successfully! Total: $${order.total.toFixed(2)}`, "success");
            cart = [];
            showCart();
            renderOrders();
        }

        function renderOrders() {
            const div = document.getElementById("orderHistory");
            if (orders.length === 0) return;
            div.innerHTML = "<h2>Order History</h2>" + orders.map(o => `
                <div class="cart-section" style="margin-top: 10px;">
                    <h3>Order #${o.order_id} — $${o.total.toFixed(2)}</h3>
                    <small>${o.created_at} | Status: ${o.status}</small>
                    <p>${o.shipping_address || "No address"}</p>
                </div>
            `).join("");
        }

        async function addProduct() {
            const name = document.getElementById("adminName").value;
            const price = parseFloat(document.getElementById("adminPrice").value);
            const category = document.getElementById("adminCategory").value;
            const stock = parseInt(document.getElementById("adminStock").value);
            const image = document.getElementById("adminImage").value || "default.jpg";
            if (!name || !price) { showAlert("adminAlert", "Name and price required", "error"); return; }
            const resp = await fetch(`${API_BASE}/api/admin/products`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, price, category, stock, image })
            });
            const data = await resp.json();
            if (resp.ok) { showAlert("adminAlert", "Product added!", "success"); fetchProducts(); }
            else { showAlert("adminAlert", data.error || "Failed", "error"); }
        }

        function showAlert(elementId, message, type) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => { el.innerHTML = ""; }, 3000);
        }

        // Search filter
        document.getElementById("searchInput").addEventListener("input", function() {
            const q = this.value.toLowerCase();
            fetch(`${API_BASE}/api/products?category=${q}`)
                .then(r => r.json())
                .then(d => renderProducts(d.products))
                .catch(() => fetchProducts());
        });

        fetchProducts();
        showCart();
    </script>
</body>
</html>
